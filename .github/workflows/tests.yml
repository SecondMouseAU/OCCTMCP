name: tests

# Runs `swift build` then `swift test`.
#
# Filed as part of the fleet-wide CI gap recorded in ecosystem#40: 12 of the 14
# repos in the OCCT stack carried a full test suite that no CI job ever executed,
# so a failing test produced a green tick. That is not hypothetical. Five
# assertions in OCCTSwiftAIS sat broken for nine days (OCCTSwiftAIS#46) because
# nothing in its pipeline ever compiled a test target.
#
# `swift build` and `swift test` are separate steps on purpose, so a compile
# failure and a test failure are distinguishable at a glance. Note that
# `swift build` alone is a weaker signal than it looks: it does not compile test
# targets at all. OCCTSwiftIO built clean with zero errors while carrying three
# real breaks in its test target during the OCCTSwift v3.0.0 repin.
#
# Blocking, not `continue-on-error`: a red here is meant to stop a merge, the same
# reasoning already written into OCCTSwiftScripts' tests.yml.
#
# macOS-only: the OCCTSwift dependency ships as a macOS xcframework, the same
# reasoning OCCTSwiftScripts' own tests.yml uses.
#
# Baseline at rollout: 218 tests passing.
#
# "Check Package.resolved is current" (#185): this runner never has a local sibling
# checkout (Package.swift's useLocalSibling gate only matches a `../<name>` folder,
# which doesn't exist on a fresh actions/checkout), so `swift package resolve` here
# already targets the real published dependency graph unconditionally, no
# OCCTMCP_FORCE_REMOTE_DEPS=1 needed. That means the plain `swift build` step below
# was always resolving correctly even while the committed Package.resolved sat stale
# at the OCCTSwift 1.17.0 line after the 3.0.0 repin (#175/#176): SwiftPM silently
# re-resolves an out-of-range pin to satisfy Package.swift's floor. This step turns
# that silent, build-time re-resolution into a fast, explicit failure instead, so a
# committed lockfile that fell out of sync with Package.swift (most likely from a
# local-sibling dev machine never touching the OCCT pins) is caught before build.

on:
  push:
    paths:
      - 'Sources/**'
      - 'SwiftTests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'SwiftTests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Check Package.resolved is current
        run: |
          swift package resolve
          if ! git diff --exit-code Package.resolved; then
            echo "::error::Package.resolved is out of sync with Package.swift's dependency floors (diff above). Run 'swift package resolve' locally and commit the result." >&2
            exit 1
          fi

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
