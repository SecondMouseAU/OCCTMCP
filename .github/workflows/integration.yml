name: integration

# Node end-to-end suite (tests/integration), which drives a real `occtkit`. Nightly and on
# demand, not on every PR: it is slow and needs occtkit, which a stock runner does not carry.
#
# NOT blocking and NOT part of `ci-gate` in tests.yml. It becomes eligible once it has a run
# of greens (see okf/policies/required-status-checks.md in OCCTSwift for the rule).
#
# The occtkit source is a build input this repo does not own (OCCTSwiftScripts), pinned to the
# revision in Package.resolved. Until a runner has produced the binary green, the job fails
# loudly rather than skipping, so it cannot read as green.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  node-integration:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc

      - name: Build occtkit
        run: |
          # Pinned to the revision Package.resolved already holds for OCCTSwiftScripts, so the pin
          # moves with the dependency instead of needing its own owner, and a red run points at
          # this repo's own change rather than at upstream HEAD.
          rev="$(python3 scripts/pinned-revision.py occtswiftscripts)"
          # Fetch the one pinned commit rather than cloning history.
          dest="$RUNNER_TEMP/OCCTSwiftScripts"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 https://github.com/SecondMouseAU/OCCTSwiftScripts.git "$rev"
          git -C "$dest" checkout -q FETCH_HEAD
          cd "$dest"
          swift build -c release --product occtkit
          echo "OCCTKIT_BIN=$PWD/.build/release/occtkit" >> "$GITHUB_ENV"
          test -x .build/release/occtkit

      - name: integration tests
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$OCCTKIT_BIN" "$HOME/.local/bin/occtkit"
          PATH="$HOME/.local/bin:$PATH" npm run test:integration
